<section class="p-6">
  <app-table
    [data$]="users$"
    [columnHeadersMap]="headersMap"
    (create)="onCreate()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)">
  </app-table>
</section>

<!-- Modal de Confirmación de Eliminación -->
<div
  *ngIf="showDeleteModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 w-80 sm:w-96 transition-transform transform scale-100">
    <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">
      ¿Seguro que quieres eliminar este usuario?
    </h3>
    <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">
      Esta acción no se puede deshacer.
    </p>

    <div class="flex justify-end gap-3">
      <button
        (click)="cancelDelete()"
        class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
        Cancelar
      </button>

      <button
        (click)="confirmDelete()"
        class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 dark:bg-red-500 dark:hover:bg-red-600 transition">
        Eliminar
      </button>
    </div>
  </div>
</div>
