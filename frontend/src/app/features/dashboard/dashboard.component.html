<div class="space-y-6">
  <!-- KPI Cards Section -->
  <section>
    <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Indicadores Clave</h2>
    <app-kpi-cards 
      [kpis]="kpis" 
      [isLoading]="isLoadingKpis"
      (aiPredictionsClick)="openPredictionsModal()">
    </app-kpi-cards>
  </section>

  <!-- Room Grid Section -->
  <section>
    <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Estado de Habitaciones</h2>
    <app-room-grid 
      [rooms]="rooms" 
      [isLoading]="isLoadingRooms"
      [isFiltered]="isRoomsFiltered"
      (createBooking)="openBookingModal($event)"
      (filterByDates)="onFilterByDates($event)"
      (clearFilter)="onClearFilter()">
    </app-room-grid>
  </section>
</div>
