<!-- Loading State -->
@if (isLoading) {
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-7 gap-4">
    @for (item of [1, 2, 3, 4, 5, 6, 7]; track item) {
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 animate-pulse">
        <div class="flex items-center justify-between">
          <div class="space-y-2">
            <div class="h-4 w-24 bg-gray-200 dark:bg-gray-700 rounded"></div>
            <div class="h-8 w-16 bg-gray-200 dark:bg-gray-700 rounded"></div>
          </div>
          <div class="w-12 h-12 bg-gray-200 dark:bg-gray-700 rounded-lg"></div>
        </div>
      </div>
    }
  </div>
}

<!-- KPI Cards -->
@if (!isLoading) {
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-7 gap-4">
    @for (kpi of kpis; track kpi.label; let i = $index) {
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-4 hover:shadow-md transition-shadow duration-200">
        <div class="flex items-start justify-between gap-3">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <p class="text-xs font-medium text-gray-600 dark:text-gray-400 whitespace-normal break-words">{{ kpi.label }}</p>
              @if (isPendingBookingsKpi(kpi)) {
                <button 
                  (click)="onAiPredictionsClick($event)"
                  class="p-1 rounded-md hover:bg-purple-100 dark:hover:bg-purple-900/30 transition-colors duration-150 cursor-pointer group"
                  title="Ver predicciones de cancelación con IA">
                  <i class="pi pi-sparkles text-xs text-purple-600 dark:text-purple-400 group-hover:scale-110 transition-transform"></i>
                </button>
              }
            </div>
            <p class="text-base md:text-lg font-bold text-gray-900 dark:text-white mt-1">{{ kpi.value }}</p>
          </div>
          @if (kpi.icon) {
            <div class="flex-shrink-0 w-7 h-7 rounded-lg flex items-center justify-center" [ngClass]="getColorClasses(i).bg">
              <i [ngClass]="[kpi.icon, 'text-sm', getColorClasses(i).icon]"></i>
            </div>
          }
        </div>
      </div>
    }
  </div>
}
