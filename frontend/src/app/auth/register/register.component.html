<div
  class="min-h-screen w-full overflow-x-hidden bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 dark:from-gray-900 dark:via-slate-900 dark:to-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-300 relative overflow-hidden"
>
  <!-- Decorative animated background elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-gradient-to-br from-blue-400/30 to-purple-500/30 dark:from-blue-500/20 dark:to-purple-600/20 rounded-full blur-3xl animate-blob"></div>
    <div class="absolute -bottom-40 -left-40 w-[28rem] h-[28rem] bg-gradient-to-tr from-indigo-400/30 to-cyan-400/30 dark:from-indigo-600/15 dark:to-cyan-500/15 rounded-full blur-3xl animate-blob animation-delay-2000"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] bg-gradient-to-r from-violet-300/20 to-pink-300/20 dark:from-violet-500/10 dark:to-pink-500/10 rounded-full blur-3xl animate-blob animation-delay-4000"></div>
  </div>

  <div
    class="relative flex items-center justify-center py-8 px-4 sm:px-6 lg:px-4 w-full"
  >
    <div class="max-w-4xl w-full">
      <div
        class="bg-white dark:bg-gray-800 rounded-xl shadow-md overflow-hidden border border-gray-200 dark:border-gray-700 transition-all duration-300"
      >
        <div class="flex flex-col md:flex-row w-full">
          <!-- Form Section -->
          <div class="w-full md:w-1/2 p-6 sm:p-8">
            <div class="text-center mb-6">
              <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-1">
                Create Account
              </h1>
              <p class="text-sm text-gray-600 dark:text-gray-400">
                Sign up to get started
              </p>
            </div>

            <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
              <!-- Username -->
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                  >Username</label
                >
                <div class="relative">
                  <div
                    class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                  >
                    <i
                      class="pi pi-user text-gray-400 dark:text-gray-500 text-sm"
                    ></i>
                  </div>
                  <input
                    formControlName="username"
                    type="text"
                    placeholder="Username"
                    class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150"
                  />
                </div>
              </div>

              <!-- Email -->
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                  >Email</label
                >
                <input
                  formControlName="email"
                  type="email"
                  placeholder="email@example.com"
                  class="block w-full px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150"
                />
              </div>

              <!-- Password -->
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                  >Password</label
                >
                <div class="relative">
                  <div
                    class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                  >
                    <i
                      class="pi pi-lock text-gray-400 dark:text-gray-500 text-sm"
                    ></i>
                  </div>
                  <input
                    formControlName="password"
                    [type]="showPassword ? 'text' : 'password'"
                    placeholder="******"
                    class="block w-full pl-10 pr-10 py-2.5 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150"
                  />
                  <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                    <button
                      type="button"
                      (click)="showPassword = !showPassword"
                      class="text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none transition-colors"
                    >
                      <i class="pi text-sm" [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Confirm Password -->
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                  >Confirm Password</label
                >
                <div class="relative">
                  <div
                    class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                  >
                    <i
                      class="pi pi-lock text-gray-400 dark:text-gray-500 text-sm"
                    ></i>
                  </div>
                  <input
                    formControlName="confirmPassword"
                    [type]="showConfirmPassword ? 'text' : 'password'"
                    placeholder="******"
                    class="block w-full pl-10 pr-10 py-2.5 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150"
                  />
                  <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                    <button
                      type="button"
                      (click)="showConfirmPassword = !showConfirmPassword"
                      class="text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none transition-colors"
                    >
                      <i class="pi text-sm" [ngClass]="showConfirmPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Hotel Details Grid with Icons -->
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Hotel Name -->
                <div>
                  <label
                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >Hotel Name</label
                  >
                  <div class="relative">
                    <div
                      class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                    >
                      <i
                        class="pi pi-building text-gray-400 dark:text-gray-500 text-sm"
                      ></i>
                    </div>
                    <input
                      formControlName="name"
                      type="text"
                      placeholder="Hotel Name"
                      class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150"
                    />
                  </div>
                </div>

                <!-- Address -->
                <div>
                  <label
                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >Address</label
                  >
                  <div class="relative">
                    <div
                      class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                    >
                      <i
                        class="pi pi-map-marker text-gray-400 dark:text-gray-500 text-sm"
                      ></i>
                    </div>
                    <input
                      formControlName="address"
                      type="text"
                      placeholder="Address"
                      class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150"
                    />
                  </div>
                </div>
                
                <!-- City -->
                <div>
                  <label
                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >City</label
                  >
                  <div class="relative">
                    <div
                      class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                    >
                      <i
                        class="pi pi-map text-gray-400 dark:text-gray-500 text-sm"
                      ></i>
                    </div>
                    <input
                      formControlName="city"
                      type="text"
                      placeholder="City"
                      class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150"
                    />
                  </div>
                </div>

                <!-- Country -->
                <div>
                  <label
                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >Country</label
                  >
                  <div class="relative">
                    <div
                      class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                    >
                      <i
                        class="pi pi-flag text-gray-400 dark:text-gray-500 text-sm"
                      ></i>
                    </div>
                    <input
                      formControlName="country"
                      list="country-list"
                      placeholder="Select a country"
                      class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150"
                    />
                    <datalist id="country-list">
                      <option
                        *ngFor="let country of filteredCountries"
                        [value]="country.name"
                      ></option>
                    </datalist>
                  </div>
                </div>

                <!-- Phone -->
                <div>
                  <label
                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >Phone</label
                  >
                  <div class="relative">
                    <div
                      class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                    >
                      <i
                        class="pi pi-phone text-gray-400 dark:text-gray-500 text-sm"
                      ></i>
                    </div>
                    <input
                      formControlName="phone"
                      type="text"
                      placeholder="Phone"
                      class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150"
                    />
                  </div>
                </div>

                <!-- Hotel Email -->
                <div>
                  <label
                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >Hotel Email</label
                  >
                  <div class="relative">
                    <div
                      class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                    >
                      <i
                        class="pi pi-envelope text-gray-400 dark:text-gray-500 text-sm"
                      ></i>
                    </div>
                    <input
                      formControlName="hotelEmail"
                      type="email"
                      placeholder="hotel@example.com"
                      class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150"
                    />
                  </div>
                </div>

                <!-- Description -->
                <div class="sm:col-span-2 lg:col-span-3">
                  <label
                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                    >Description</label
                  >
                  <textarea
                    formControlName="description"
                    placeholder="Hotel Description"
                    rows="3"
                    class="block w-full px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150"
                  ></textarea>
                </div>
              </div>

              <!-- Submit Button -->
              <button
                type="submit"
                [disabled]="form.invalid"
                class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition"
              >
                <i class="pi pi-user-plus mr-2 text-sm"></i>
                Register
              </button>

              <!-- Login Link -->
              <div class="text-center text-sm">
                <p class="text-gray-600 dark:text-gray-400">
                  Already have an account?
                  <a
                    routerLink="login"
                    class="font-medium text-blue-600 dark:text-blue-400 hover:text-blue-500 dark:hover:text-blue-300 transition-colors duration-200"
                    >Log in</a
                  >
                </p>
              </div>
            </form>

            <!-- Dark Mode Toggle -->
            <div
              class="mt-6 pt-4 border-t border-gray-200 dark:border-gray-700"
            >
              <button
                type="button"
                (click)="toggleDarkMode()"
                class="w-full flex items-center justify-center gap-2 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md transition"
              >
                <i class="pi" [ngClass]="isDarkMode ? 'pi-sun' : 'pi-moon'"></i>
                <span>{{ isDarkMode ? "Light Mode" : "Dark Mode" }}</span>
              </button>
            </div>
          </div>

          <!-- Visual Section -->
          <div
            class="hidden md:flex md:w-1/2 bg-gradient-to-br from-blue-600 to-purple-700 dark:from-gray-700 dark:to-gray-900 items-center justify-center p-12 relative overflow-hidden"
          >
            <!-- Background Pattern -->
            <div class="absolute inset-0 opacity-10">
              <div
                class="absolute inset-0"
                style="
                  background-image: radial-gradient(
                    circle at 25% 25%,
                    white 2px,
                    transparent 2px
                  );
                  background-size: 30px 30px;
                "
              ></div>
            </div>

            <!-- Content (logo + mensaje) -->
            <div class="relative text-center text-white">
              <div class="mb-1 flex items-center justify-center">
                <svg class="genie-login" width="150" height="150" viewBox="0 0 400.461 400.461" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                  <path fill="#ffffff" d="M363.183,140.661c-85.913,23.041-109.339,13.599-133.812,2.597c-2.822-13.106-26.66-23.626-57.081-25.428

    c0-7.667-6.219-13.887-13.893-13.887c-7.664,0-13.879,6.22-13.879,13.887c0,3.818,1.541,7.275,4.032,9.787

                </svg>
              </div>
              <h2 class="text-3xl font-bold mb-4 mt-0">Maguestic</h2>
              <p
                class="text-lg text-blue-100 dark:text-gray-300 leading-relaxed mb-8"
              >
                Reserva, administra y controla tu hotel desde una sola plataforma en la nube.
              </p>
              <div class="flex justify-center space-x-6 text-sm">
                <div class="flex items-center">
                  <i class="pi pi-check-circle mr-2"></i>
                  <span>Rápido</span>
                </div>
                <div class="flex items-center">
                  <i class="pi pi-check-circle mr-2"></i>
                  <span>Moderno</span>
                </div>
                <div class="flex items-center">
                  <i class="pi pi-check-circle mr-2"></i>
                  <span>Fácil</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
