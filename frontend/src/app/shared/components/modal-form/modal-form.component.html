<div class="bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 p-6 rounded-lg">
  <h2 mat-dialog-title class="text-xl font-semibold mb-6 text-gray-900 dark:text-gray-100">
    {{ data?.user ? 'Editar Usuario' : 'Agregar Usuario' }}
  </h2>

  <mat-dialog-content class="!p-0">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="mt-2">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label class="text-gray-600 dark:text-gray-300">Usuario</mat-label>
          <input
            matInput
            formControlName="username"
            class="text-gray-900 dark:text-gray-100 bg-transparent"
            placeholder="Ingrese el nombre"
          />
          <mat-error *ngIf="userForm.get('username')?.hasError('required')">
            El nombre es requerido
          </mat-error>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label class="text-gray-600 dark:text-gray-300">Email</mat-label>
        <input
          matInput
          formControlName="email"
          class="text-gray-900 dark:text-gray-100 bg-transparent"
          placeholder="Ingrese el email"
          type="email"
        />
        <mat-error *ngIf="userForm.get('email')?.hasError('required')">
          El email es requerido
        </mat-error>
        <mat-error *ngIf="userForm.get('email')?.hasError('email')"> Email inválido </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label class="text-gray-600 dark:text-gray-300">Contraseña</mat-label>
        <input
          matInput
          formControlName="password"
          class="text-gray-900 dark:text-gray-100 bg-transparent"
          type="password"
          placeholder="Ingrese la contraseña"
        />
        <mat-error *ngIf="userForm.get('password')?.hasError('required')">
          La contraseña es requerida
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label class="text-gray-600 dark:text-gray-300">Confirmar Contraseña</mat-label>
        <input
          matInput
          formControlName="confirmPassword"
          class="text-gray-900 dark:text-gray-100 bg-transparent"
          type="password"
          placeholder="Confirme la contraseña"
        />
        <mat-error *ngIf="userForm.get('confirmPassword')?.hasError('required')">
          Confirmar contraseña es requerido
        </mat-error>
      </mat-form-field>

      <div *ngIf="userForm.hasError('passwordMismatch')" class="text-red-500 text-sm mt-2">
        Las contraseñas no coinciden
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="!p-0 mt-6 space-x-2">
    <button
      mat-button
      (click)="close()"
      class="text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"
    >
      Cancelar
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="onSubmit()"
      [disabled]="userForm.invalid"
      class="!bg-cyan-600 hover:!bg-cyan-700 disabled:!bg-gray-600 disabled:!text-gray-400"
    >
      Guardar
    </button>
  </mat-dialog-actions>
</div>
