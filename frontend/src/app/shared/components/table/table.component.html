<div class="flex flex-col gap-4">
  <!-- Botón Agregar -->
  <div class="flex justify-end">
    <button
      (click)="onCreate()"
      class="bg-blue-600 inline-add hover:bg-blue-700 text-white font-semibold shadow"
    >
      + Agregar
    </button>
  </div>

  <!-- Barra de búsqueda -->
  <div class="flex items-center gap-2 max-w-md w-full">
    <div class="relative w-full">
      <span
        class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"
      >
        <i class="pi pi-search"></i>
      </span>
      <input
        type="text"
        placeholder="Buscar..."
        (input)="applyFilter($event)"
        class="w-full pl-10 pr-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-100"
      />
    </div>
  </div>

  <!-- Contenedor de la tabla -->
  <div
    class="relative overflow-x-auto shadow-md sm:rounded-lg bg-white dark:bg-gray-900"
  >
    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      class="w-full text-sm text-left rtl:text-right divide-y divide-gray-200 dark:divide-gray-700"
    >
      <!-- Columnas dinámicas -->
      <ng-container
        *ngFor="let column of displayedColumns"
        [matColumnDef]="column"
      >
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          class="px-6 py-3 bg-gray-100 dark:bg-gray-800 text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase tracking-wide"
        >
          {{ getHeader(column) }}
        </th>

        <td
          mat-cell
          *matCellDef="let element"
          class="px-6 py-4 text-gray-800 dark:text-gray-100 whitespace-nowrap"
        >
          <!-- Columna acciones -->
          <ng-container *ngIf="column === 'actions'; else normalCell">
            <div class="action-buttons">
              <button
                (click)="onEdit(element)"
                title="Editar"
                class="action-btn edit"
                aria-label="Editar"
              >
                <i class="pi pi-pencil"></i>
              </button>

              <button
                (click)="onDelete(element.id)"
                title="Eliminar"
                class="action-btn delete"
                aria-label="Eliminar"
              >
                <i class="pi pi-trash"></i>
              </button>
            </div>
          </ng-container>

          <!-- Celda normal con transformación -->
          <ng-template #normalCell>
            <ng-container *ngIf="columnTransformMap && columnTransformMap[column]; else defaultCell">
              {{ columnTransformMap[column](element[column]) }}
            </ng-container>
            <ng-template #defaultCell>
              {{ element[column] }}
            </ng-template>
          </ng-template>
        </td>
      </ng-container>

      <!-- Filas -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors"
      ></tr>
    </table>

    <!-- Paginador -->
    <div
      class="border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 p-2"
    >
      <mat-paginator
        class="custom-paginator"
        [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons
      >
      </mat-paginator>
    </div>
  </div>
</div>
